# Copy this file to .github/workflows/chatgpt2api-image.yml when the repository
# should build the image. GitHub-hosted runners provide Docker. Do not run it
# until CLOUDFLARE_API_TOKEN is stored as a GitHub Actions secret.
name: chatgpt2api image
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/chatgpt2api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: deploy/chatgpt2api/package-lock.json
      - run: npm ci
      - run: npm test
      - run: sh ops/push-image.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 29a44cf6b1d2c5d00f51960def5bb48d
          WRITE_IMAGE_PIN: "1"
